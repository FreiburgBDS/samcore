name: Set up Windows build toolchain
description: >-
  Install the LLVM toolchain (Clang), the LLVM OpenMP runtime and HDF5 from
  conda-forge for building samcore on Windows.

# samcore's OpenMP loops use unsigned (size_t) loop indices, which MSVC's
# OpenMP 2.0 implementation rejects with error C3016; GCC/Clang accept them.
# The README therefore recommends LLVM Clang on Windows, and this mirrors it:
# conda-forge provides Clang, llvm-openmp and HDF5 in one ABI-consistent
# environment.  On non-Windows runners the steps below are no-ops.

runs:
  using: composite
  steps:
    - name: Create conda-forge toolchain environment
      if: runner.os == 'Windows'
      id: conda
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: samcore-build
        create-args: >-
          clangxx
          llvm-openmp
          hdf5=1.14
          cmake
          ninja
        init-shell: none
        cache-environment: true

    - name: Export toolchain paths and compiler env
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $prefix = "${{ steps.conda.outputs.environment-path }}"
        "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        "$prefix\Library\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        # Environment for any CMake configure in later steps: use Clang with
        # the Ninja generator, and point the toolchain at the conda prefix.
        # scikit-build-core reads CMAKE_ARGS; LTO is disabled because clang's
        # -flto needs lld-link on Windows (link.exe cannot consume LLVM
        # bitcode), which is not installed here.
        @(
          "HDF5_ROOT=$prefix\Library"
          "CMAKE_PREFIX_PATH=$prefix\Library"
          "INCLUDE=$prefix\Library\include"
          "LIB=$prefix\Library\lib"
          "CC=clang"
          "CXX=clang++"
          "CMAKE_ARGS=-G Ninja -DSAMCORE_ENABLE_LTO=OFF"
        ) | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Host "Windows toolchain prefix: $prefix"
