name: Build wheels & attach to release

on:
  push:
    tags:
      - "v*"
      - "ci-test*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest   # manylinux/musllinux x86_64
          - ubuntu-24.04-arm # manylinux/musllinux aarch64
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel

      # HDF5 is required (find_package(HDF5 COMPONENTS CXX REQUIRED)). On
      # Linux it is installed inside the manylinux/musllinux container (see
      # CIBW_BEFORE_ALL_LINUX below). On Windows and macOS the conda-forge
      # toolchain action installs HDF5, Clang and llvm-openmp and exports the
      # compiler env (Clang is required on Windows because MSVC's OpenMP 2.0
      # rejects the unsigned loop indices, error C3016; on macOS because
      # AppleClang has no OpenMP).
      - uses: ./.github/actions/setup-conda-toolchain

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_ARCHS_LINUX: auto
          CIBW_ARCHS_MACOS: auto
          # 64-bit only: the LLVM clang GNU driver cannot target 32-bit
          # Windows against the win32 CPython the way MSVC's vcvars does.
          CIBW_ARCHS_WINDOWS: AMD64
          # HDF5 + ninja inside the Linux containers. CIBW_BEFORE_ALL_* runs
          # once per container (before the whole CPython matrix), so the
          # system packages are not re-installed for every Python version.
          # manylinux is RHEL-based (yum on manylinux2014, dnf on
          # manylinux_2_28+); musllinux is Alpine and uses apk, where HDF5's
          # C++ headers ship in hdf5-dev (community repo).
          CIBW_BEFORE_ALL_LINUX: |
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache --repository "https://dl-cdn.alpinelinux.org/alpine/v$(cut -d. -f1,2 /etc/alpine-release)/community" build-base cmake hdf5-dev ninja
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y hdf5-devel ninja-build
            else
              yum install -y hdf5-devel ninja-build
            fi
          # numpy is intentionally NOT installed here: pip's build isolation
          # pulls it from [build-system].requires in pyproject.toml, and the
          # wheel test env gets it as the package's declared dependency.
          # Windows: bundle the HDF5/OpenMP runtime DLLs into the wheel
          # (delvewheel is installed into the build env; HDF5_ROOT is exported
          # by the toolchain action above). Commands on Windows run under
          # cmd.exe, so use %VAR% syntax here, not PowerShell's $env:VAR.
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path "%HDF5_ROOT%\bin" -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/python -v -p no:cacheprovider

      - name: Show artifacts
        shell: bash
        run: ls -lh wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install HDF5
        run: |
          sudo apt-get update
          sudo apt-get -y install libhdf5-dev ninja-build

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Attach artifacts to GitHub Release
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Run for every tag this workflow is triggered by ("v*" and "ci-test*").
    # A tag-less run (workflow_dispatch on a branch) skips this job.
    # Note: a job skipped via `if` cannot be re-run on its own, so the CI
    # test tags must be allowed here too, otherwise publish stays skipped.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: List artifacts
        run: ls -lh dist

      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # ci-test* releases are marked prerelease so they never become
          # the repository's "Latest" release.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Real releases only - the ci-test* tags must never reach PyPI.
    if: startsWith(github.ref, 'refs/tags/v')
    # Must match the "Environment name" configured for the trusted publisher
    # on PyPI (see README).  Add required reviewers here for a manual gate.
    environment:
      name: pypi
      url: https://pypi.org/p/samcore
    permissions:
      id-token: write # OIDC trusted publishing (no API token/secret)
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      # Trusted Publishing: authenticates via the GitHub OIDC token.  PEP 740
      # attestations are enabled by default.  `dist/` holds the wheels + sdist.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1