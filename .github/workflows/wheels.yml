name: Build wheels & attach to release

on:
  push:
    tags:
      - "v*"
      - "ci-test*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is intentionally omitted for now: AppleClang ships no OpenMP,
        # and building redistributable HDF5/libomp from source on macOS is not
        # set up yet (see README: "MacOS: Not yet tested").
        os:
          - ubuntu-latest   # manylinux x86_64
          - ubuntu-24.04-arm # manylinux aarch64
          - windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel

      # HDF5 is required (find_package(HDF5 COMPONENTS CXX REQUIRED)). On
      # Linux it is installed inside the manylinux container (see
      # CIBW_BEFORE_ALL_LINUX below). On Windows the LLVM/conda-forge action
      # installs HDF5, Clang and llvm-openmp and exports HDF5_ROOT for the
      # build and repair steps below.
      #
      # Clang (not MSVC) is required on Windows: samcore's OpenMP loops use
      # unsigned loop indices, which MSVC's OpenMP 2.0 rejects (error C3016).
      - uses: ./.github/actions/setup-windows-toolchain

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_ARCHS_LINUX: auto
          # 64-bit only: the LLVM clang GNU driver cannot target 32-bit
          # Windows against the win32 CPython the way MSVC's vcvars does.
          CIBW_ARCHS_WINDOWS: AMD64
          # musllinux (Alpine) is out of scope for now: Alpine uses apk and
          # splits HDF5's C++ bindings into a separate package, neither of
          # which the RHEL-based before-all below handles.
          CIBW_SKIP: "*-musllinux_*"
          # HDF5 + ninja inside the manylinux container. CIBW_BEFORE_ALL_*
          # runs once per container (before the whole CPython matrix), so the
          # system packages are not re-installed for every Python version.
          # manylinux images are RHEL-based but the package manager varies
          # (manylinux2014 = yum, manylinux_2_28+ = dnf), so try both.
          CIBW_BEFORE_ALL_LINUX: >-
            yum install -y hdf5-devel ninja-build ||
            dnf install -y hdf5-devel ninja-build
          # numpy is intentionally NOT installed here: pip's build isolation
          # pulls it from [build-system].requires in pyproject.toml, and the
          # wheel test env gets it as the package's declared dependency.
          # Windows: bundle the HDF5/OpenMP runtime DLLs into the wheel
          # (delvewheel is installed into the build env; HDF5_ROOT is exported
          # by the toolchain action above). Commands on Windows run under
          # cmd.exe, so use %VAR% syntax here, not PowerShell's $env:VAR.
          CIBW_BEFORE_BUILD_WINDOWS: python -m pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path "%HDF5_ROOT%\bin" -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/python -v -p no:cacheprovider

      - name: Show artifacts
        shell: bash
        run: ls -lh wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HDF5
        run: |
          sudo apt-get update
          sudo apt-get -y install libhdf5-dev ninja-build

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Attach artifacts to GitHub Release
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Only run for tag pushes; attach to the release for that tag.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: List artifacts
        run: ls -lh dist

      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*