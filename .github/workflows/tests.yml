name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install HDF5 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get -y install libhdf5-dev ninja-build

      # Windows/macOS use the conda-forge LLVM toolchain (as DEVELOPMENT.md
      # recommends): MSVC's OpenMP 2.0 rejects the unsigned loop indices
      # (error C3016) and AppleClang has no OpenMP.  The action also installs
      # HDF5 and llvm-openmp and exports the compiler env.
      - uses: ./.github/actions/setup-conda-toolchain

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Build and install package
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      # One lane also installs CPU-only torch so the optional interop tests
      # (tests/python/test_torch_interop.py) actually run instead of skipping.
      # torch is not a package dependency; the CPU index keeps the download
      # small (the default PyPI wheel pulls ~3 GB of CUDA libraries).
      - name: Install CPU torch for interop tests
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Python 3.8+ no longer searches %PATH% for an extension module's DLL
      # dependencies, so the conda HDF5/OpenMP runtime DLLs must sit next to
      # the compiled extension.  The released wheels get this from delvewheel;
      # here we copy them in for the source install.
      - name: Bundle runtime DLLs next to extension (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $pkg = Join-Path $site 'samcore'
          Copy-Item (Join-Path $env:HDF5_ROOT 'bin\*.dll') $pkg -Force
          Write-Host "bundled $((Get-ChildItem $pkg -Filter *.dll).Count) runtime DLLs into $pkg"

      - name: Run Python tests
        env:
          SAMCORE_TEST_DATA_DIR: tests/data
        run: pytest tests/python -v

  cpp-tests:
    name: C++ (sanitizers) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # x86_64 and aarch64: the numeric kernels must agree across ISAs and
      # libm implementations, not just on the development architecture.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get -y install libhdf5-dev ninja-build

      - name: Configure, build, test (debug + sanitizers)
        run: |
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-debug --output-on-failure

  # Release exercises the shipped configuration (-O2 -ffast-math -flto, see
  # SAMCORE_ENABLE_FAST_MATH).  The IEEE Debug lane above cannot catch
  # codegen-dependent drift (FMA contraction, reassociation, vector width),
  # so both ISAs are tested here too.
  cpp-tests-release:
    name: C++ (release) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get -y install libhdf5-dev ninja-build

      - name: Configure, build, test (release + fast-math)
        run: |
          cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release
          ctest --test-dir build-release --output-on-failure