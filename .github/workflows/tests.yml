name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is excluded: AppleClang ships no OpenMP and the HDF5/OpenMP
        # setup for macOS isn't in place yet (see README: "MacOS: Not yet
        # tested").
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install HDF5 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get -y install libhdf5-dev ninja-build

      # Windows uses the LLVM toolchain from conda-forge (as the README
      # recommends): samcore's OpenMP loops use unsigned loop indices, which
      # MSVC's OpenMP 2.0 rejects (error C3016).  The action also installs
      # HDF5 and llvm-openmp and exports HDF5_ROOT / the compiler env.
      - uses: ./.github/actions/setup-windows-toolchain

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build and install package
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run Python tests
        env:
          SAMCORE_TEST_DATA_DIR: tests/data
        run: pytest tests/python -v

  cpp-tests:
    name: C++ (sanitizers) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get -y install libhdf5-dev ninja-build

      - name: Configure, build, test (debug + sanitizers)
        run: |
          cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-debug --output-on-failure